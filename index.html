<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Top‑Down Survival Boilerplate</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; }
    #game { width: 100%; height: 100vh; height: 100dvh; }
    #game canvas { touch-action: none; }
    .menu-button {
      min-width: 44px;
      min-height: 48px;
      padding: 12px 20px;
      border: 2px solid #888;
      border-radius: 8px;
      background: #222;
      color: #fff;
      font: bold 18px monospace;
      cursor: pointer;
      touch-action: manipulation;
    }
    .menu-button:focus-visible { outline: 3px solid #0f8; outline-offset: 3px; }
    #pause-button {
      position: fixed;
      top: max(12px, env(safe-area-inset-top));
      right: max(12px, env(safe-area-inset-right));
      z-index: 20;
    }
    #pause-dialog {
      box-sizing: border-box;
      width: min(360px, calc(100vw - 32px));
      max-height: calc(100dvh - 32px);
      padding: 24px;
      border: 2px solid #666;
      border-radius: 12px;
      background: #181818;
      color: #fff;
      font: 16px/1.5 monospace;
      text-align: center;
    }
    #pause-dialog::backdrop { background: rgb(0 0 0 / 75%); }
    #pause-dialog h2 { margin-top: 0; }
    .pause-actions { display: grid; gap: 16px; }
    #resume-button { background: #006638; }
    #upgrade-button { background: #554400; }
    #quit-button { background: #663333; }
    #touch-joystick {
      position: fixed;
      left: max(20px, env(safe-area-inset-left));
      bottom: max(20px, env(safe-area-inset-bottom));
      z-index: 15;
      box-sizing: border-box;
      width: 136px;
      height: 136px;
      border: 2px solid rgb(255 255 255 / 50%);
      border-radius: 50%;
      background: rgb(0 0 0 / 35%);
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }
    .joystick-thumb {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      border-radius: 50%;
      background: rgb(255 255 255 / 70%);
      transform: translate(-50%, -50%) translate(var(--stick-x, 0px), var(--stick-y, 0px));
      pointer-events: none;
    }
    .joystick-label {
      position: absolute;
      bottom: 8px;
      left: 0;
      width: 100%;
      color: #fff;
      font: bold 12px monospace;
      text-align: center;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="touch-joystick" role="group" aria-label="Movement joystick" hidden>
    <span class="joystick-thumb" aria-hidden="true"></span>
    <span class="joystick-label" aria-hidden="true">MOVE</span>
  </div>
  <button id="pause-button" class="menu-button" aria-haspopup="dialog" aria-controls="pause-dialog" hidden>Menu</button>
  <dialog id="pause-dialog" aria-labelledby="pause-title" aria-describedby="pause-description">
    <h2 id="pause-title">PAUSED</h2>
    <p id="pause-description">End this run to spend XP on upgrades, or return to character selection. Earned XP and upgrades are saved.</p>
    <div class="pause-actions">
      <button id="resume-button" class="menu-button" autofocus>Resume</button>
      <button id="upgrade-button" class="menu-button">End Run &amp; Upgrade</button>
      <button id="quit-button" class="menu-button">Quit to Menu</button>
    </div>
  </dialog>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
